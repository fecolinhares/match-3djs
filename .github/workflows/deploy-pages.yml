# ============================================================
# Deploy Match-3D.js para GitHub Pages
# Quando o repositório for tornado público (ou plan com Pages),
# ative Pages em Settings → Pages → Source: GitHub Actions
# Este workflow roda no push para main.
# ============================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite deploy manual via Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # O vite.config usa dist (local build step).
      # Copia para ./dist no workspace para o upload-pages-artifact.
      - name: Stage build artifact
        run: |
          mkdir -p ./dist
          cp -r dist/* ./dist/
          ls -la ./dist/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
